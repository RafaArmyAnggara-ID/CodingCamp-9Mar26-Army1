<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Widget Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .timer-container {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
        }
        .timer-display {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }
        .timer-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .timer-controls button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .timer-settings {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        .duration-input {
            width: 80px;
            padding: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Timer Widget Test</h1>
    <div id="timer-container" class="timer-container"></div>

    <script type="module">
        import TimerWidget from './components/timer.js';

        const container = document.getElementById('timer-container');
        const timer = new TimerWidget(container);
        timer.init();

        console.log('Timer initialized successfully!');
        console.log('Duration:', timer.duration, 'seconds');
        console.log('Remaining:', timer.remaining, 'seconds');
    </script>
</body>
</html>
